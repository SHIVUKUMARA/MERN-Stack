# ==========================================================
# Backend Reverse Proxy
# ==========================================================

server {

    listen 80;

    server_name _;


    # ------------------------------------------------------
    # Health Check
    # ------------------------------------------------------

    location /health {

        proxy_pass http://backend:5000;
        # Notice: backend
        # This is not: localhost and not: 127.0.0.1
        # backend is the Compose service name. Our Compose network will provide DNS resolution:
        # Nginx container
            #   │
            #   │ backend:5000
            #   ▼
        # Backend container
        # So: proxy_pass http://backend:5000;
        # means: Forward this request to the backend service on port 5000.

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # Nginx can tell Express whether the original request was HTTP or HTTPS.
    }


    # ------------------------------------------------------
    # Backend API
    # ------------------------------------------------------

    location / {

        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}