groups:
  - name: backend-alerts
    rules:
      # Backend is unreachable
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend is down"
          description: "Prometheus cannot reach the backend for more than 1 minute."

      # Too many server errors
      - alert: High5xxErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status_code=~"5.."}[5m]))
            /
            sum(rate(http_requests_total[5m]))
          ) * 100 > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate"
          description: "The backend 5xx error rate has been above 5% for 5 minutes."

      # Slow API responses
      - alert: HighResponseTime
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket[5m])
            )
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API response time"
          description: "95th percentile API response time has exceeded 2 seconds for 5 minutes."

      # High backend container memory
      - alert: HighContainerMemory
        expr: |
          (
            container_memory_usage_bytes{name="backend-prod"}
            /
            container_spec_memory_limit_bytes{name="backend-prod"}
          ) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Backend container memory is high"
          description: "Backend container memory usage has exceeded 80% for 5 minutes."
      
      # BullMQ email queue has a growing backlog
      - alert: EmailQueueBacklog
        expr: bullmq_waiting_jobs > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Email queue backlog is growing"
          description: "More than 50 email jobs have been waiting for over 5 minutes."

      # BullMQ email queue has a critical backlog
      - alert: EmailQueueCriticalBacklog
        expr: bullmq_waiting_jobs > 100
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical email queue backlog"
          description: "More than 100 email jobs have been waiting for over 5 minutes."

      # Too many retained failed email jobs
      - alert: EmailJobsFailing
        expr: bullmq_failed_jobs > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Too many failed email jobs"
          description: "More than 10 failed email jobs are currently retained in BullMQ."

      # All worker concurrency slots are occupied and jobs are waiting
      - alert: EmailWorkersSaturated
        expr: bullmq_active_jobs >= 10 and bullmq_waiting_jobs > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Email workers are saturated"
          description: "All 10 worker concurrency slots are occupied and more than 20 jobs are waiting."

      # BullMQ metrics are missing
      - alert: EmailQueueMetricsUnavailable
        expr: absent(bullmq_waiting_jobs)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "BullMQ metrics unavailable"
          description: "Prometheus has not received the BullMQ waiting jobs metric for more than 2 minutes."
