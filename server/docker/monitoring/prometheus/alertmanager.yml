global:
  resolve_timeout: 5m

  smtp_smarthost: "sandbox.smtp.mailtrap.io:2525"
  smtp_from: "mernsender@production.com"
  smtp_auth_username: "c579e324d706d6"
  smtp_auth_password_file: "/run/secrets/mailtrap_password"

route:
  receiver: "email"

receivers:
  - name: "email"
    email_configs:
      - to: "mernreceiver@production.com"
        send_resolved: true
        headers:
          subject: '{{ if eq .Status "firing" }}🚨 [FIRING] {{ .CommonAnnotations.summary }}{{ else }}✅ [RESOLVED] {{ .CommonAnnotations.summary }}{{ end }}'
