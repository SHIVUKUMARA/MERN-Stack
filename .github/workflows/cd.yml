name: CD

# on:
#   push:
#     branches:
#       - feature/CICD

# Instead of above workflow we are using below one because we need to make CD dependable on CI runs successfull
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:
  docker:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'feature/CICD'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -f server/docker/production/Dockerfile \
            -t ghcr.io/shivukumara/mern-backend:${{ github.event.workflow_run.head_sha }} \
            server

      - name: Push Docker image
        run: docker push ghcr.io/shivukumara/mern-backend:${{ github.event.workflow_run.head_sha }}

      - name: Deploy to Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

# Push feature/CICD
#        ↓
# CI
#  ├─ npm ci
#  ├─ lint
#  └─ test
#        ↓
#    success?
#     ↙     ↘
#   NO       YES
#   ↓         ↓
# STOP       CD
#            ↓
#        Docker build
#            ↓
#         GHCR
#            ↓
#         Render 🚀
