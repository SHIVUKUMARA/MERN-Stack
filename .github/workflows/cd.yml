name: CD

on:
  push:
    branches:
      - feature/CICD

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -f server/docker/production/Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/mern-backend:${{ github.sha }} \
            server

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/mern-backend:${{ github.sha }}
